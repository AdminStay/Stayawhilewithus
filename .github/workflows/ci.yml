name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staywhile_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/staywhile_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/staywhile_ci?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci_placeholder
      N8N_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_SHARED_SECRET: ci-secret-outbound
      N8N_INBOUND_WEBHOOK_SHARED_SECRET: ci-secret-inbound
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Plain postgres:16 lacks the Supabase roles that the RLS/grant
      # hardening migrations reference; create no-login placeholders.
      - name: Create Supabase placeholder roles
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d staywhile_ci -v ON_ERROR_STOP=1
          -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_admin NOLOGIN;"

      - name: Apply migrations
        run: pnpm --filter @stayw/database db:migrate:deploy

      - name: Lint
        run: pnpm lint

      # Serialized: website#db:generate re-runs `prisma generate` into the
      # shared client while @stayw/database#typecheck reads it in parallel.
      - name: Typecheck
        run: pnpm typecheck --concurrency=1

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
